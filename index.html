<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CAT'S CRADLE // NEURAL STRINGS</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --cyan: #00ffff;
    --magenta: #ff00ff;
    --yellow: #ffff00;
    --bg: #050a14;
    --panel: rgba(0,20,40,0.85);
  }

  html, body {
    width: 100%; height: 100%;
    background: var(--bg);
    overflow: hidden;
    font-family: 'Share Tech Mono', monospace;
    color: var(--cyan);
  }

  #app {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* CRT scanline overlay */
  #app::after {
    content: '';
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      to bottom,
      transparent 0px,
      transparent 2px,
      rgba(0,0,0,0.18) 2px,
      rgba(0,0,0,0.18) 4px
    );
    pointer-events: none;
    z-index: 100;
    mix-blend-mode: multiply;
  }

  /* Vignette */
  #app::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.75) 100%);
    pointer-events: none;
    z-index: 99;
  }

  #canvas-container {
    position: relative;
    width: 100%;
    height: 100%;
  }

  #video {
    position: absolute;
    width: 1px; height: 1px;
    opacity: 0; pointer-events: none;
  }

  canvas {
    display: block;
  }

  /* HUD */
  #hud {
    position: absolute;
    top: 0; left: 0; right: 0;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    padding: 18px 24px;
    z-index: 50;
    pointer-events: none;
  }

  #title-block {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  #title {
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(14px, 2vw, 22px);
    font-weight: 900;
    letter-spacing: 0.25em;
    color: var(--cyan);
    text-shadow: 0 0 12px var(--cyan), 0 0 28px var(--cyan);
    line-height: 1;
  }

  #subtitle {
    font-size: 10px;
    letter-spacing: 0.3em;
    color: rgba(0,255,255,0.45);
    text-transform: uppercase;
  }

  #status-panel {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 6px;
  }

  .status-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    letter-spacing: 0.15em;
    color: rgba(0,255,255,0.6);
  }

  .dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: #333;
    box-shadow: none;
    transition: background 0.3s, box-shadow 0.3s;
  }
  .dot.active {
    background: var(--cyan);
    box-shadow: 0 0 8px var(--cyan);
  }
  .dot.warn { background: var(--yellow); box-shadow: 0 0 8px var(--yellow); }

  #bottom-hud {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    display: flex;
    justify-content: center;
    padding: 14px;
    z-index: 50;
    pointer-events: none;
  }

  #instructions {
    font-size: 10px;
    letter-spacing: 0.2em;
    color: rgba(0,255,255,0.3);
    text-align: center;
  }

  #loading-screen {
    position: absolute;
    inset: 0;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    z-index: 200;
    transition: opacity 0.8s ease;
  }

  #loading-screen.hidden { opacity: 0; pointer-events: none; }

  #loading-title {
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(24px, 5vw, 48px);
    font-weight: 900;
    letter-spacing: 0.3em;
    color: var(--cyan);
    text-shadow: 0 0 20px var(--cyan), 0 0 60px var(--cyan);
    animation: pulse 2s ease-in-out infinite;
  }

  #loading-msg {
    font-size: 12px;
    letter-spacing: 0.25em;
    color: rgba(0,255,255,0.5);
    min-height: 20px;
  }

  #progress-bar {
    width: 240px; height: 2px;
    background: rgba(0,255,255,0.15);
    position: relative;
    overflow: hidden;
  }
  #progress-fill {
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 0%;
    background: var(--cyan);
    box-shadow: 0 0 10px var(--cyan);
    transition: width 0.4s ease;
  }

  @keyframes pulse {
    0%,100% { opacity: 1; }
    50% { opacity: 0.6; }
  }

  #particle-canvas {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 10;
  }
</style>
</head>
<body>
<div id="app">
  <div id="loading-screen">
    <div id="loading-title">CAT'S CRADLE</div>
    <div id="loading-msg">INITIALIZING NEURAL TRACKING...</div>
    <div id="progress-bar"><div id="progress-fill"></div></div>
  </div>

  <div id="canvas-container">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="main-canvas"></canvas>
    <canvas id="particle-canvas"></canvas>
  </div>

  <div id="hud">
    <div id="title-block">
      <div id="title">CAT'S CRADLE</div>
      <div id="subtitle">Neural String Interface v2.1</div>
    </div>
    <div id="status-panel">
      <div class="status-row">
        <span>CAMERA</span><span class="dot" id="dot-cam"></span>
      </div>
      <div class="status-row">
        <span>LEFT HAND</span><span class="dot" id="dot-left"></span>
      </div>
      <div class="status-row">
        <span>RIGHT HAND</span><span class="dot" id="dot-right"></span>
      </div>
      <div class="status-row">
        <span>STRINGS</span><span class="dot" id="dot-strings"></span>
      </div>
    </div>
  </div>

  <div id="bottom-hud">
    <div id="instructions">RAISE BOTH HANDS TO ACTIVATE STRINGS &nbsp;|&nbsp; BRING FINGERTIPS TOGETHER FOR FUSION EVENT</div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>

<script>
// ─── State ────────────────────────────────────────────────────────────────
const state = {
  hands: { left: null, right: null },
  prevHands: { left: null, right: null },
  particles: [],
  stringHistory: [], // for trail blur
  frame: 0,
};

// ─── Canvas Setup ────────────────────────────────────────────────────────
const mainCanvas = document.getElementById('main-canvas');
const ctx = mainCanvas.getContext('2d');
const pCanvas = document.getElementById('particle-canvas');
const pCtx = pCanvas.getContext('2d');
const video = document.getElementById('video');

function resize() {
  const W = window.innerWidth, H = window.innerHeight;
  mainCanvas.width = pCanvas.width = W;
  mainCanvas.height = pCanvas.height = H;
}
resize();
window.addEventListener('resize', resize);

// ─── Status Dots ─────────────────────────────────────────────────────────
function setDot(id, state) {
  const el = document.getElementById(id);
  el.className = 'dot' + (state ? ' ' + state : '');
}

// ─── Progress ────────────────────────────────────────────────────────────
const progressFill = document.getElementById('progress-fill');
const loadingMsg = document.getElementById('loading-msg');
const loadingScreen = document.getElementById('loading-screen');

function setProgress(pct, msg) {
  progressFill.style.width = pct + '%';
  if (msg) loadingMsg.textContent = msg;
}

// ─── Fingertip landmark indices ──────────────────────────────────────────
const FINGERTIPS = [4, 8, 12, 16, 20]; // thumb, index, middle, ring, pinky
const ALL_LANDMARKS = Array.from({length: 21}, (_, i) => i);

// ─── Color helpers ───────────────────────────────────────────────────────
function lerpColor(c1, c2, t) {
  const r1=parseInt(c1.slice(1,3),16), g1=parseInt(c1.slice(3,5),16), b1=parseInt(c1.slice(5,7),16);
  const r2=parseInt(c2.slice(1,3),16), g2=parseInt(c2.slice(3,5),16), b2=parseInt(c2.slice(5,7),16);
  const r=Math.round(r1+(r2-r1)*t), g=Math.round(g1+(g2-g1)*t), b=Math.round(b1+(b2-b1)*t);
  return `rgb(${r},${g},${b})`;
}

function stringColor(dist, maxDist) {
  // cyan → magenta → yellow as hands spread
  const t = Math.min(dist / maxDist, 1);
  if (t < 0.5) return lerpColor('#00ffff', '#ff00ff', t * 2);
  return lerpColor('#ff00ff', '#ffff00', (t - 0.5) * 2);
}

// ─── Hand landmark → canvas coords ───────────────────────────────────────
function lmToCanvas(lm) {
  const W = mainCanvas.width, H = mainCanvas.height;
  // mirrored: flip x
  return { x: (1 - lm.x) * W, y: lm.y * H };
}

// ─── Glow line ───────────────────────────────────────────────────────────
function glowLine(ctx, x1, y1, x2, y2, color, thickness, glowSize, alpha=1) {
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.strokeStyle = color;
  ctx.lineWidth = glowSize;
  ctx.shadowColor = color;
  ctx.shadowBlur = glowSize * 3;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x2, y2);
  ctx.stroke();
  // bright core
  ctx.globalAlpha = alpha * 0.9;
  ctx.lineWidth = thickness;
  ctx.shadowBlur = glowSize;
  ctx.strokeStyle = '#ffffff';
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x2, y2);
  ctx.stroke();
  ctx.restore();
}

// ─── Glow dot ────────────────────────────────────────────────────────────
function glowDot(ctx, x, y, r, color, alpha=1) {
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.shadowColor = color;
  ctx.shadowBlur = r * 4;
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fill();
  // white core
  ctx.shadowBlur = r * 2;
  ctx.fillStyle = `rgba(255,255,255,0.9)`;
  ctx.beginPath();
  ctx.arc(x, y, r * 0.45, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

// ─── Particles ───────────────────────────────────────────────────────────
const COLORS = ['#00ffff','#ff00ff','#ffff00','#ffffff','#80ffff'];

function spawnParticles(x, y, n=30) {
  for (let i = 0; i < n; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 1.5 + Math.random() * 5;
    const color = COLORS[Math.floor(Math.random() * COLORS.length)];
    state.particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 1.0,
      decay: 0.025 + Math.random() * 0.04,
      r: 1.5 + Math.random() * 3,
      color,
    });
  }
}

function updateParticles() {
  pCtx.clearRect(0, 0, pCanvas.width, pCanvas.height);
  state.particles = state.particles.filter(p => p.life > 0);
  for (const p of state.particles) {
    p.x += p.vx;
    p.y += p.vy;
    p.vx *= 0.95;
    p.vy *= 0.95;
    p.life -= p.decay;
    glowDot(pCtx, p.x, p.y, p.r, p.color, Math.max(0, p.life));
  }
}

// ─── Hand silhouette ─────────────────────────────────────────────────────
const CONNECTIONS = [
  [0,1],[1,2],[2,3],[3,4],
  [0,5],[5,6],[6,7],[7,8],
  [5,9],[9,10],[10,11],[11,12],
  [9,13],[13,14],[14,15],[15,16],
  [13,17],[17,18],[18,19],[19,20],
  [0,17]
];

function drawHand(lms, color) {
  const pts = lms.map(lmToCanvas);

  // Skeleton
  for (const [a, b] of CONNECTIONS) {
    const p1 = pts[a], p2 = pts[b];
    glowLine(ctx, p1.x, p1.y, p2.x, p2.y, color, 1.5, 4, 0.55);
  }

  // Landmarks
  for (let i = 0; i < pts.length; i++) {
    const isTip = FINGERTIPS.includes(i);
    const r = isTip ? 5 : 3;
    const c = isTip ? '#ffffff' : color;
    glowDot(ctx, pts[i].x, pts[i].y, r, c, isTip ? 0.95 : 0.65);
  }
}

// ─── Elastic string drawing ───────────────────────────────────────────────
function drawStrings(leftLms, rightLms) {
  const lPts = leftLms.map(lmToCanvas);
  const rPts = rightLms.map(lmToCanvas);

  // Wrist-to-wrist distance for scaling
  const wristDist = Math.hypot(lPts[0].x - rPts[0].x, lPts[0].y - rPts[0].y);
  const maxDist = mainCanvas.width * 0.8;
  const t = Math.min(wristDist / maxDist, 1);
  const thickness = Math.max(1.5, 6 - t * 4);

  setDot('dot-strings', 'active');

  const touchThreshold = 28;
  let anyTouch = false;

  for (let fi = 0; fi < FINGERTIPS.length; fi++) {
    const li = FINGERTIPS[fi];
    const lp = lPts[li];
    const rp = rPts[li];

    const dist = Math.hypot(lp.x - rp.x, lp.y - rp.y);
    const color = stringColor(dist, maxDist);

    // Slight elastic sag — midpoint droops based on tension
    const sag = Math.min(40, wristDist * 0.06) * (fi % 2 === 0 ? 1 : -1);
    const mx = (lp.x + rp.x) / 2;
    const my = (lp.y + rp.y) / 2 + sag;

    // Quadratic bezier for elastic look
    ctx.save();
    ctx.shadowColor = color;
    ctx.shadowBlur = 20;
    ctx.strokeStyle = color;
    ctx.lineWidth = thickness;
    ctx.lineCap = 'round';
    ctx.globalAlpha = 0.85;
    ctx.beginPath();
    ctx.moveTo(lp.x, lp.y);
    ctx.quadraticCurveTo(mx, my, rp.x, rp.y);
    ctx.stroke();

    // Bright core
    ctx.shadowBlur = 8;
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = Math.max(0.5, thickness * 0.3);
    ctx.globalAlpha = 0.6;
    ctx.beginPath();
    ctx.moveTo(lp.x, lp.y);
    ctx.quadraticCurveTo(mx, my, rp.x, rp.y);
    ctx.stroke();
    ctx.restore();

    // Touch detection → particle burst
    if (dist < touchThreshold) {
      anyTouch = true;
      // Throttle by checking last burst
      if (!state._lastBurst || state.frame - state._lastBurst > 8) {
        spawnParticles((lp.x + rp.x) / 2, (lp.y + rp.y) / 2, 22);
        state._lastBurst = state.frame;
      }
      // Touch halo
      glowDot(ctx, (lp.x+rp.x)/2, (lp.y+rp.y)/2, 10, '#ffffff', 0.9);
    }
  }
}

// ─── Main draw loop ───────────────────────────────────────────────────────
function drawFrame() {
  const W = mainCanvas.width, H = mainCanvas.height;
  state.frame++;

  // Deep midnight blue with slight fade (motion blur feel)
  ctx.globalAlpha = 0.82;
  ctx.fillStyle = '#050a14';
  ctx.fillRect(0, 0, W, H);
  ctx.globalAlpha = 1;

  // Subtle grid
  ctx.save();
  ctx.strokeStyle = 'rgba(0,255,255,0.04)';
  ctx.lineWidth = 1;
  const gs = 60;
  for (let x = 0; x < W; x += gs) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
  }
  for (let y = 0; y < H; y += gs) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }
  ctx.restore();

  const { left, right } = state.hands;

  // Draw hands
  if (left) drawHand(left, '#00ffff');
  if (right) drawHand(right, '#ff00ff');

  // Draw strings
  if (left && right) {
    drawStrings(left, right);
  } else {
    setDot('dot-strings', '');
  }

  // Status
  setDot('dot-left', left ? 'active' : '');
  setDot('dot-right', right ? 'active' : '');

  updateParticles();
  requestAnimationFrame(drawFrame);
}

// ─── MediaPipe Hands ─────────────────────────────────────────────────────
async function initMediaPipe() {
  setProgress(10, 'LOADING MEDIAPIPE...');

  const hands = new Hands({
    locateFile: file =>
      `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
  });

  setProgress(35, 'CONFIGURING MODEL...');

  hands.setOptions({
    maxNumHands: 2,
    modelComplexity: 1,
    minDetectionConfidence: 0.7,
    minTrackingConfidence: 0.6,
  });

  hands.onResults(results => {
    state.hands.left = null;
    state.hands.right = null;

    if (results.multiHandLandmarks && results.multiHandedness) {
      for (let i = 0; i < results.multiHandLandmarks.length; i++) {
        const label = results.multiHandedness[i].label;
        // MediaPipe flips: "Left" in mirror = user's right, etc.
        if (label === 'Left') state.hands.right = results.multiHandLandmarks[i];
        else state.hands.left = results.multiHandLandmarks[i];
      }
    }
  });

  setProgress(55, 'REQUESTING CAMERA...');

  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { width: 1280, height: 720, facingMode: 'user' },
      audio: false,
    });
    video.srcObject = stream;
    await video.play();
    setDot('dot-cam', 'active');
    setProgress(75, 'CAMERA ACTIVE...');
  } catch (e) {
    setDot('dot-cam', 'warn');
    setProgress(0, 'CAMERA ERROR: ' + e.message);
    return;
  }

  setProgress(90, 'STARTING DETECTION...');

  const camera = new Camera(video, {
    onFrame: async () => {
      await hands.send({ image: video });
    },
    width: 1280,
    height: 720,
  });
  await camera.start();

  setProgress(100, 'NEURAL LINK ESTABLISHED');
  setTimeout(() => {
    loadingScreen.classList.add('hidden');
    setTimeout(() => loadingScreen.remove(), 900);
  }, 600);
}

// ─── Boot ─────────────────────────────────────────────────────────────────
drawFrame();
initMediaPipe().catch(err => {
  loadingMsg.textContent = 'ERROR: ' + err.message;
  console.error(err);
});
</script>
</body>
</html>
